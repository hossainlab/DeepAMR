[project]
name = "deepamr"
version = "1.0.0"
description = "Deep Learning for Antimicrobial Resistance Prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",

    # Imbalanced learning
    "imbalanced-learn>=0.11.0",

    # API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",

    # Data processing
    "pandas>=2.0.0",
    "biopython>=1.81",

    # Security & rate limiting
    "slowapi>=0.1.9",

    # PDF report generation
    "reportlab>=4.0.0",

    # Utilities
    "requests>=2.31.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
